[workspace]
name = "employee-exit-surveys"
version = "0.1.0"
description = "Australian Government Employee Exit Survey Analysis (DETE vs TAFE)"
authors = ["Haider Muhib <haydermuhib@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
streamlit = ">=1.35.0"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
pyarrow = ">=12.0.0"
matplotlib-base = ">=3.8.0"
seaborn = ">=0.13.0"
scipy = ">=1.11.0"
nbformat = ">=5.9.0"
ipykernel = ">=6.29.0"

[tasks]
download-data = "python data/download_data.py"
data-prep = "python src/data_prep.py"
etl = "python src/data_prep.py"
app = "streamlit run streamlit_app.py"
test = "python -c 'import pandas, numpy, matplotlib, seaborn, streamlit; print(\"Environment verified\")'"

